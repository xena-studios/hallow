name: Network

# Builds the proxy and server images from the pinned submodules, starts the
# dev network and runs netcheck: join through the proxy, switch servers.
# main requires the "netcheck" job. Changes that only touch docs skip the
# build and pass, so the required check never blocks them.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: network-${{ github.ref }}
  cancel-in-progress: true

jobs:
  netcheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Decide whether the network needs testing
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qvE '\.md$|^docs/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs changed; skipping the network test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.changes.outputs.run == 'true'

      - name: Build the proxy and server images
        if: steps.changes.outputs.run == 'true'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: deploy/compose/compose.yaml
          targets: proxy,lobby
          load: true
          set: |
            proxy.cache-from=type=gha,scope=proxy
            proxy.cache-to=type=gha,scope=proxy,mode=max
            lobby.cache-from=type=gha,scope=server
            lobby.cache-to=type=gha,scope=server,mode=max

      - name: Install Rust
        if: steps.changes.outputs.run == 'true'
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changes.outputs.run == 'true'

      - name: Build netcheck
        if: steps.changes.outputs.run == 'true'
        run: cargo build --locked -p netcheck

      - name: Start the network
        if: steps.changes.outputs.run == 'true'
        run: docker compose -f deploy/compose/compose.yaml up -d --no-build --wait --wait-timeout 180

      - name: Join and switch servers
        if: steps.changes.outputs.run == 'true'
        run: target/debug/netcheck --route game-1,lobby,game-1,lobby

      - name: Show the network's logs
        if: failure() && steps.changes.outputs.run == 'true'
        run: docker compose -f deploy/compose/compose.yaml logs --no-color

      - name: Stop the network
        if: always() && steps.changes.outputs.run == 'true'
        run: docker compose -f deploy/compose/compose.yaml down
