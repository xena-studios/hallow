name: Check

# Validates the Renovate config, checks the docs for broken relative links,
# lints and dry-runs the node install script, and formats, lints, tests and
# builds the Rust crates. main requires the "check" and "rust" jobs. The
# control plane's tests run against Valkey, hallow-db's against PostgreSQL.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate the Renovate config
        run: npx --yes --package renovate -- renovate-config-validator --strict renovate.json
      - name: Check relative links in the docs
        run: |
          status=0
          for f in $(git ls-files '*.md'); do
            dir=$(dirname "$f")
            for link in $(grep -oE '\]\([^)#:]+(#[^)]*)?\)' "$f" | sed -E 's/^\]\(([^)#]+).*/\1/'); do
              [ -e "$dir/$link" ] || { echo "$f: broken link $link"; status=1; }
            done
          done
          exit $status
      - name: Lint and dry-run the node install script
        run: |
          shellcheck deploy/node/*.sh
          deploy/node/test-install.sh

  rust:
    runs-on: ubuntu-26.04
    services:
      valkey:
        image: valkey/valkey:9.1-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
        ports:
          - 6379:6379
      postgres:
        image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      HALLOW_TEST_REDIS_URL: redis://127.0.0.1:6379
      HALLOW_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          # netcheck and the plugins build against Pumpkin; vineprobe reads Vine's WIT.
          submodules: true
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-wasip2
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Lint and test the host crates
        run: |
          cargo clippy -p netcheck -p hallow-proto -p hallow-control-plane -p hallow-db -p hallow-fleet -p hallow-manifest -p hallow-provider-hetzner-cloud --all-targets -- -D warnings
          cargo test -p netcheck -p hallow-proto -p hallow-control-plane -p hallow-db -p hallow-vine -p hallow-server -p hallow-fleet -p hallow-manifest -p hallow-provider-hetzner-cloud
      - name: Lint and build the plugins
        run: |
          # hallow-proto is linted for WASM too, since plugins build against it.
          cargo clippy --target wasm32-wasip2 -p hallow-proto -p hallow-vine -p hallow-server -p apiprobe -p tickwatch -p vineprobe -- -D warnings
          cargo build --release --target wasm32-wasip2 -p hallow-vine -p hallow-server -p apiprobe -p tickwatch -p vineprobe
