name: Check

# Validates the Renovate config, checks the docs for broken relative links,
# and formats, lints, tests and builds the Rust crates. main requires the
# "check" and "rust" jobs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate the Renovate config
        run: npx --yes --package renovate -- renovate-config-validator --strict renovate.json
      - name: Check relative links in the docs
        run: |
          status=0
          for f in $(git ls-files '*.md'); do
            dir=$(dirname "$f")
            for link in $(grep -oE '\]\([^)#:]+(#[^)]*)?\)' "$f" | sed -E 's/^\]\(([^)#]+).*/\1/'); do
              [ -e "$dir/$link" ] || { echo "$f: broken link $link"; status=1; }
            done
          done
          exit $status

  rust:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # netcheck and the plugins build against Pumpkin; vineprobe reads Vine's WIT.
          submodules: true
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-wasip2
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Lint and test netcheck
        run: |
          cargo clippy -p netcheck --all-targets -- -D warnings
          cargo test -p netcheck
      - name: Lint and build the plugins
        run: |
          cargo clippy --target wasm32-wasip2 -p apiprobe -p tickwatch -p vineprobe -- -D warnings
          cargo build --release --target wasm32-wasip2 -p apiprobe -p tickwatch -p vineprobe
