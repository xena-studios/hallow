# Hallow server base config. Every lobby and game starts from this; a server
# repo's config/pumpkin.toml is layered on top. ${HALLOW_*} values are filled
# in from the environment when the container starts.

[networking.java]
address = "0.0.0.0:25565"
# The proxy authenticates players and forwards their identity.
online_mode = false
motd = "${HALLOW_SERVER_NAME}"

[networking.bedrock]
enabled = false

[networking.lan_broadcast]
enabled = false

[networking.proxy]
enabled = true

[networking.proxy.vine]
enabled = true
secret = "${HALLOW_VINE_SECRET}"

[telemetry]
enabled = false

[update_checker]
enabled = false

[logging]
color = false

# Hallow's server plugin: pre-approve its permissions so Pumpkin doesn't ask
# on the console. It reads only these variables from the environment.
[plugins.overrides.hallow_server]
allowed_permissions = [
  "http.outbound",
  "fs.read.data",
  "sys.env.HALLOW_CONTROL_PLANE",
  "sys.env.HALLOW_CONTROL_PLANE_TOKEN",
  "sys.env.HALLOW_CONTROL_PLANE_TOKEN_FILE",
  "sys.env.HALLOW_SERVER_NAME",
  "sys.env.HALLOW_SERVER_KIND",
  "sys.env.HALLOW_SERVER_VERSION",
  "sys.env.HALLOW_SERVER_ROLE",
  "sys.env.HALLOW_SERVER_ADDRESS",
  "sys.env.HALLOW_MAX_PLAYERS",
]
