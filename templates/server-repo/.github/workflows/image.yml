name: Image

# Checks hallow.toml, builds this server's image on Hallow's server base image
# and publishes it to GHCR as ghcr.io/<owner>/<name in hallow.toml>:
#   - a vX.Y.Z tag publishes X.Y.Z, a version the panel can make live;
#   - a push to main publishes sha-<commit> and dev, for staging only;
#   - pull requests build and check without publishing.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  image:
    uses: xena-studios/hallow/.github/workflows/server-image.yml@e0f479756680d9009a056b6eb62642366f656cef # main
    permissions:
      contents: read
      packages: write
    # Builds the game's plugin (plugin/, on hallow-sdk) into plugins/ first.
    with:
      rust: true
      prepare: |
        cd plugin
        cargo build --release --target wasm32-wasip2
        cp target/wasm32-wasip2/release/example.wasm ../plugins/
