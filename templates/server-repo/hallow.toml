# What this server kind is and how Hallow runs it. The full format is in
# Hallow's docs/SERVERS.md#hallowtoml; `hallow-manifest check` validates it.
name = "example"             # the server kind: lowercase, digits and dashes
role = "game"                # "hub", "lobby" or "game"
lobby = "hub"                # where players go when a match ends (games)
base = "^0.2"                # Hallow base image versions this repo works with
# world = "world"            # Pumpkin's world folder; Pumpkin generates one if unset

[players]
min = 2                      # start a match when this many are queued (games)
max = 12                     # players per instance

[scaling]
warm = 1                     # idle instances kept ready while players are online
max_instances = 100

# [maps]                     # games: map worlds, read by hallow-sdk
# dir = "maps"               # copied into the first plugin's data folder on start
# pick = "random"            # or "vote"

# The game's WASM plugins, copied into Pumpkin's plugin folder. name
# defaults to the file name without .wasm. plugin/ builds example.wasm on
# hallow-sdk; these permissions are hallow_sdk::permissions().
[[plugins]]
file = "plugins/example.wasm"
permissions = [
  "fs.read.data",
  "fs.write.data",
  "sys.env.HALLOW_MIN_PLAYERS",
  "sys.env.HALLOW_MAX_PLAYERS",
  "sys.env.HALLOW_MAPS_PICK",
]

# Pumpkin settings that differ from Hallow's defaults, merged over the base
# image's pumpkin.toml. Networking, telemetry and Hallow's own plugin are
# fixed by the base image.
[pumpkin]
default_difficulty = "Peaceful"

# Environment for the server; the instance's own environment wins.
# [env]
# EXAMPLE_MODE = "solo"
