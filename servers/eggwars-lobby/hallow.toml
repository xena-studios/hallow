# Egg Wars' lobby: where players pick Egg Wars from the hub's game menu (or
# /lobby eggwars), queue with the buttons or /play eggwars, and come back to
# when a match ends. See docs/SERVERS.md#hallowtoml.
name = "eggwars-lobby"
role = "lobby"
lobby = "hub"
queues = ["eggwars"]
base = "^0.2"

[players]
max = 60

[scaling]
warm = 1
max_instances = 4

# The shared lobby plugin (servers/lobby-plugin): welcome, queue buttons and
# a safe spawn, set up by LOBBY_TITLE and LOBBY_MODES below.
[[plugins]]
file = "plugins/hallow_game_lobby.wasm"
permissions = ["sys.env.LOBBY_TITLE", "sys.env.LOBBY_MODES"]

[pumpkin]
default_gamemode = "Adventure"
default_difficulty = "Peaceful"
allow_nether = false
allow_end = false

[pumpkin.pvp]
enabled = false

[env]
LOBBY_TITLE = "§6§lEGG WARS"
LOBBY_MODES = "eggwars=Teams of 2|Four teams, four eggs, one winner"
