[package]
name = "hallow-banned"
version = "0.1.0"
description = "The banned lobby's Pumpkin plugin: a closed room that shows a banned player their ban, when it ends and how to appeal."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
hallow-proto = { path = "../../../crates/proto" }
pumpkin-plugin-api.workspace = true
serde_json = "1.0.154"
tracing.workspace = true
uuid = { version = "1.29", default-features = false }
