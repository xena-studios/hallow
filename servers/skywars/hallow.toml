# Sky Wars, solo: eight players, each caged on their own island. One match
# per instance on a solo map picked from maps/, built fresh as its chunks
# generate. Players return to skywars-lobby when it ends. The teams kind is
# hallow-teams.toml, from the same folder. Rules and tuning:
# docs/games/SKYWARS.md.
name = "skywars"
role = "game"
lobby = "skywars-lobby"
base = "^0.2"

[players]
min = 2
max = 8                      # eight islands

[scaling]
warm = 1
max_instances = 50

[maps]
dir = "maps"                 # also copied into the plugin's data folder
pick = "random"              # HALLOW_GAME_MAP picks one by file name

[[plugins]]
file = "plugins/hallow_skywars.wasm"
permissions = [
  "fs.read.data",
  "sys.env.HALLOW_GAME_TEST_HOOKS",
  "sys.env.HALLOW_GAME_MAP",
  "sys.env.SKYWARS_MODE",
  "sys.env.SKYWARS_MIN_PLAYERS",
  "sys.env.HALLOW_COMBAT",
]

[pumpkin]
default_gamemode = "Adventure"
default_difficulty = "Normal"
allow_nether = false
allow_end = false

[pumpkin.pvp]
enabled = true

[env]
SKYWARS_MODE = "solo"        # picks maps with modes = ["solo"]
SKYWARS_MIN_PLAYERS = "2"
