[package]
name = "hallow-test-game"
version = "0.2.0"
description = "The dev network's test game on hallow-sdk: a short team match that ends and sends its players back to their lobby."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
hallow-sdk = { path = "../../../crates/hallow-sdk" }
pumpkin-plugin-api.workspace = true
tracing.workspace = true
uuid = { version = "1.29", default-features = false }
