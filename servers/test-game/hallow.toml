# A test game for the dev network: an empty Pumpkin world that registers as
# a game, with a plugin (plugin/, built into plugins/) that runs a timed
# match when TEST_GAME_MATCH_SECS is set. Players return to test-game-lobby
# when a match ends.
name = "test-game"
role = "game"
lobby = "test-game-lobby"
base = "^0.1"

[players]
min = 2                      # start a match when this many are queued
max = 16                     # one match per instance

[scaling]
warm = 1                     # idle instances kept ready while players are online
max_instances = 20

[[plugins]]
file = "plugins/hallow_test_game.wasm"
permissions = ["sys.env.TEST_GAME_MATCH_SECS"]
