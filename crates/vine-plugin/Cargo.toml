[package]
name = "hallow-vine"
version = "0.1.0"
description = "Hallow's Vine plugin: links each proxy to the control plane for presence, the global player count, duplicate-login checks, the shared server list and cross-proxy commands."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
hallow-anticheat = { path = "../anticheat" }
hallow-proto = { path = "../proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }
uuid = { version = "1.29", default-features = false }
wasip2 = { version = "2.0.1", default-features = false }
wit-bindgen.workspace = true
