[package]
name = "hallow-sdk"
version = "0.1.0"
description = "Hallow's minigame library for server repos: arenas, the match lifecycle, teams, kits, sidebars, spectating and stats, plus the link to the control plane (WASM)."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hallow-proto = { path = "../proto" }
pumpkin-plugin-api.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }
tracing.workspace = true
uuid = { version = "1.29", default-features = false }
