[package]
name = "hallow-provider-hetzner-cloud"
version = "0.1.0"
description = "Hetzner Cloud provider for Hallow's fleet manager: hourly burst nodes through the Hetzner Cloud API."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hallow-fleet = { path = "../../fleet" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing.workspace = true

[dev-dependencies]
axum = "0.8.9"
tokio.workspace = true
