# Geyser in front of the dev network, so Bedrock players can join: they
# connect to Geyser (RakNet or NetherNet), which joins Vine as a Java player.
# Layer it on compose.yaml, or on the two-proxy override too:
#
#   docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.geyser.yaml up --build -d
#
# Bedrock clients connect to localhost:19132. Geyser joins Vine's Geyser-only
# listener (proxy:25567) with Floodgate's encrypted handoff, and Vine gives
# each Bedrock player Floodgate's Java identity: "." + gamertag, UUID
# 00000000-0000-0000-xxxx-xxxxxxxxxxxx from the xuid, and their own IP.
# DEV ONLY: the key (config/floodgate/key.pem) is checked in, and Geyser
# doesn't validate Bedrock logins, so bots can pick any gamertag and xuid.
# Geyser talks to the proxy directly, so don't combine it with
# compose.lb.yaml (whose proxies only accept PROXY protocol) yet.

services:
  geyser:
    build:
      context: ../geyser
    image: hallow-geyser:${HALLOW_IMAGE_TAG:-dev}
    # Geyser rewrites its config on upgrades, so it works on a copy.
    entrypoint:
      - sh
      - -c
      - cp /config/config.yml /geyser/config.yml && exec java -Xms256M -Xmx1G -jar /opt/geyser.jar --nogui
    volumes:
      - ./config/geyser/config.yml:/config/config.yml:ro
      # Floodgate's key; the proxy mounts the same file.
      - ./config/floodgate/key.pem:/floodgate/key.pem:ro
    ports:
      - "19132:19132/udp"
      - "19132:19132/tcp"
      - "19133:19133/udp"
    depends_on:
      proxy:
        condition: service_healthy
    restart: unless-stopped
    tty: true
