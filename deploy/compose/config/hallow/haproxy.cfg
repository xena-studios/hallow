# Dev load balancer for the two-proxy network (compose.lb.yaml).
#
# - Spreads players over the proxies (leastconn).
# - Passes each player's real address to Vine with PROXY protocol v2.
# - Asks the control plane's agent port about each proxy every 2 s:
#   - "drain" sets the proxy's weight to 0, so it gets no new players while
#     the players on it stay;
#   - "down" takes it out entirely;
#   - "up ready" puts it back.

global
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    # Minecraft connections are long-lived.
    timeout client 1h
    timeout server 1h

frontend minecraft
    bind :25565
    default_backend proxies

backend proxies
    balance leastconn
    default-server send-proxy-v2 check check-send-proxy inter 5s agent-check agent-addr control-plane agent-port 8081 agent-inter 2s
    server proxy-1 proxy-1:25565 agent-send "proxy-1\n"
    server proxy-2 proxy-2:25565 agent-send "proxy-2\n"

# Server states and weights, for checking drains: http://localhost:8404/
frontend stats
    mode http
    bind :8404
    stats enable
    stats uri /
    stats refresh 2s
