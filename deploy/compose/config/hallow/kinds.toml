# Server kinds the dev control plane starts instances of (HALLOW_KINDS_FILE,
# compose.instances.yaml). Each is the image to run and the hallow.toml it was
# built from, relative to this file; the control plane reads role, players
# and scaling from it. ${HALLOW_IMAGE_TAG:-dev} comes from the environment.
# See docs/INSTANCES.md.

[[kind]]
image = "hallow-test-game:${HALLOW_IMAGE_TAG:-dev}"
manifest = "test-game/hallow.toml"
memory_mb = 1024

[[kind]]
image = "hallow-test-game-lobby:${HALLOW_IMAGE_TAG:-dev}"
manifest = "test-game-lobby/hallow.toml"
memory_mb = 1024

# The launch games and their lobbies (servers/eggwars, servers/skywars).
# Each lobby keeps one instance warm; games start as players queue.
[[kind]]
image = "hallow-eggwars:${HALLOW_IMAGE_TAG:-dev}"
manifest = "eggwars/hallow.toml"
memory_mb = 1536

[[kind]]
image = "hallow-eggwars-lobby:${HALLOW_IMAGE_TAG:-dev}"
manifest = "eggwars-lobby/hallow.toml"
memory_mb = 1024

[[kind]]
image = "hallow-skywars:${HALLOW_IMAGE_TAG:-dev}"
manifest = "skywars/hallow.toml"
memory_mb = 1536

[[kind]]
image = "hallow-skywars-teams:${HALLOW_IMAGE_TAG:-dev}"
manifest = "skywars/hallow-teams.toml"
memory_mb = 1536

[[kind]]
image = "hallow-skywars-lobby:${HALLOW_IMAGE_TAG:-dev}"
manifest = "skywars-lobby/hallow.toml"
memory_mb = 1024
