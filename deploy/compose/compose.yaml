# Hallow dev network: one proxy and two servers on one machine.
#
#   servers/build-plugins.sh               # the servers' own plugins, into servers/*/plugins
#   docker compose -f deploy/compose/compose.yaml up --build
#   cargo run --release -p netcheck        # join through the proxy and switch servers
#
# Connect a 26.3 client to localhost:25565. The proxy runs in offline mode, so
# any username works. The servers are built the way server repos build them:
# the lobby from servers/hub, game-1 from servers/test-game, each FROM the
# server base image. Here the base comes from templates/server in this tree
# (the server-base service), standing in for the published one by name.

x-server: &server
  restart: unless-stopped
  tty: true

# Server repos' Dockerfiles start FROM this name; the build context of the same
# name replaces it with the server-base service's image.
x-base: &base
  ghcr.io/xena-studios/hallow-server-base:0.2: service:server-base

services:
  proxy:
    build:
      context: ../..
      dockerfile: templates/proxy/Dockerfile
    image: hallow-proxy:${HALLOW_IMAGE_TAG:-dev}
    ports:
      - "25565:25565"
    volumes:
      - ./config/vine.toml:/proxy/vine.toml:ro
    depends_on:
      lobby:
        condition: service_healthy
      game-1:
        condition: service_healthy
    restart: unless-stopped
    tty: true

  # Build-only: the server base image the lobby and game-1 build on. Scale 0
  # keeps it from starting.
  server-base:
    build:
      context: ../..
      dockerfile: templates/server/Dockerfile
    image: hallow-server-base:${HALLOW_IMAGE_TAG:-dev}
    scale: 0

  lobby:
    <<: *server
    build:
      context: ../../servers/hub
      additional_contexts:
        <<: *base
    image: hallow-hub:${HALLOW_IMAGE_TAG:-dev}
    environment:
      HALLOW_VINE_SECRET: ${HALLOW_VINE_SECRET:-hallow-dev-secret-not-for-production}
      HALLOW_SERVER_NAME: lobby

  game-1:
    <<: *server
    build:
      context: ../../servers/test-game
      additional_contexts:
        <<: *base
    image: hallow-test-game:${HALLOW_IMAGE_TAG:-dev}
    environment:
      HALLOW_VINE_SECRET: ${HALLOW_VINE_SECRET:-hallow-dev-secret-not-for-production}
      HALLOW_SERVER_NAME: game-1
