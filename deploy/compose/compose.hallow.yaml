# Hallow two-proxy dev network: an override for compose.yaml that adds the
# control plane, Valkey and a second proxy, with both proxies running the
# hallow_vine plugin and both servers registering themselves through the
# hallow_server plugin. DEV ONLY: the token and secret in config/hallow are
# checked-in defaults.
#
#   servers/build-plugins.sh
#   docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.hallow.yaml up --build -d
#
# Proxies: localhost:25565 (proxy-1) and localhost:25566 (proxy-2).
# Control plane: localhost:18090 (token in config/hallow/control-plane.token).

# Both proxies mount the same Vine config, plugin, token and secret; only
# config.toml (proxy id and address) differs. A missing hallow_vine.wasm or
# hallow_server.wasm makes Docker create an empty directory in its place;
# build the plugins first.
x-hallow-proxy: &hallow-proxy
  depends_on:
    control-plane:
      condition: service_healthy
    lobby:
      condition: service_healthy
    game-1:
      condition: service_healthy

services:
  valkey:
    image: valkey/valkey:9.1-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 6

  postgres:
    image: postgres:18-alpine
    environment:
      # Dev only.
      POSTGRES_PASSWORD: hallow-dev
      POSTGRES_DB: hallow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  control-plane:
    build:
      context: ../..
      dockerfile: deploy/control-plane/Dockerfile
    image: hallow-control-plane:${HALLOW_IMAGE_TAG:-dev}
    environment:
      HALLOW_TOKEN_FILE: /run/hallow/token
      HALLOW_REDIS_URL: redis://valkey:6379
      HALLOW_DATABASE_URL: postgres://postgres:hallow-dev@postgres:5432/hallow
      # Dev only: the netcheck bot used for the staff command test.
      HALLOW_ADMINS: netstaff
    volumes:
      - ./config/hallow/control-plane.token:/run/hallow/token:ro
    ports:
      - "127.0.0.1:18090:8080"
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The servers mount the dev build over the plugin baked into the image (the
  # entrypoint copies it into plugins/ on start), the token, and their own
  # config.toml (name and address; kind, role and max players come from each
  # server's hallow.toml).
  lobby:
    volumes:
      - ../../target/wasm32-wasip2/release/hallow_server.wasm:/opt/hallow/plugins/hallow_server.wasm:ro
      - ./config/hallow/control-plane.token:/server/plugins/data/hallow_server/token:ro
      - ./config/hallow/lobby.toml:/server/plugins/data/hallow_server/config.toml:ro
    depends_on:
      control-plane:
        condition: service_healthy

  game-1:
    volumes:
      - ../../target/wasm32-wasip2/release/hallow_server.wasm:/opt/hallow/plugins/hallow_server.wasm:ro
      - ./config/hallow/control-plane.token:/server/plugins/data/hallow_server/token:ro
      - ./config/hallow/game-1.toml:/server/plugins/data/hallow_server/config.toml:ro
    depends_on:
      control-plane:
        condition: service_healthy

  proxy:
    <<: *hallow-proxy
    networks:
      default:
        aliases: [proxy-1]
    volumes:
      - ./config/hallow/vine.toml:/proxy/vine.toml:ro
      - ../../target/wasm32-wasip2/release/hallow_vine.wasm:/proxy/plugins/hallow_vine.wasm:ro
      - ./config/hallow/control-plane.token:/proxy/plugins/data/hallow_vine/token:ro
      - ./config/hallow/forwarding.secret:/proxy/plugins/data/hallow_vine/forwarding.secret:ro
      - ./config/hallow/proxy-1.toml:/proxy/plugins/data/hallow_vine/config.toml:ro

  proxy-2:
    <<: *hallow-proxy
    build:
      context: ../..
      dockerfile: templates/proxy/Dockerfile
    image: hallow-proxy:${HALLOW_IMAGE_TAG:-dev}
    ports:
      - "25566:25565"
    volumes:
      - ./config/hallow/vine.toml:/proxy/vine.toml:ro
      - ../../target/wasm32-wasip2/release/hallow_vine.wasm:/proxy/plugins/hallow_vine.wasm:ro
      - ./config/hallow/control-plane.token:/proxy/plugins/data/hallow_vine/token:ro
      - ./config/hallow/forwarding.secret:/proxy/plugins/data/hallow_vine/forwarding.secret:ro
      - ./config/hallow/proxy-2.toml:/proxy/plugins/data/hallow_vine/config.toml:ro
    restart: unless-stopped
    tty: true
