# Dynamic game instances for the two-proxy dev network: an override for
# compose.yaml + compose.hallow.yaml. The control plane starts and deletes
# test-game containers itself through the local Docker Engine
# (HALLOW_ORCHESTRATOR=docker), the way it does through Wings on real nodes
# (docs/INSTANCES.md). game-1 is built but not started; the hub (lobby) stays
# a static compose service, the network's floor.
#
# DEV ONLY: the control plane gets the Docker socket and runs as root to use
# it, which is root on the host.
#
#   cargo build --release --target wasm32-wasip2 -p hallow-vine -p hallow-server
#   docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.hallow.yaml \
#     -f deploy/compose/compose.instances.yaml up --build -d
#
# Instances join the network named by HALLOW_DOCKER_NETWORK (default
# hallow-dev) and are labelled hallow.owner=<that name>. `down` doesn't
# remove them; delete them first:
#   docker rm -f $(docker ps -aq --filter label=hallow.owner=hallow-dev)

x-proxy-deps: &proxy-deps
  depends_on: !override
    control-plane:
      condition: service_healthy
    lobby:
      condition: service_healthy

networks:
  default:
    name: ${HALLOW_DOCKER_NETWORK:-hallow-dev}

services:
  control-plane:
    user: "0"
    environment:
      HALLOW_ORCHESTRATOR: docker
      HALLOW_DOCKER_NETWORK: ${HALLOW_DOCKER_NETWORK:-hallow-dev}
      HALLOW_INSTANCE_CONTROL_PLANE: control-plane:8080
      HALLOW_INSTANCE_ENV: HALLOW_VINE_SECRET=${HALLOW_VINE_SECRET:-hallow-dev-secret-not-for-production}
      HALLOW_KINDS_FILE: /etc/hallow/kinds/kinds.toml
      # Expanded in kinds.toml's images.
      HALLOW_IMAGE_TAG: ${HALLOW_IMAGE_TAG:-dev}
      # Short, so a finished dev game goes quickly.
      HALLOW_INSTANCE_EMPTY_SECS: ${HALLOW_INSTANCE_EMPTY_SECS:-10}
      HALLOW_INSTANCE_IDLE_SECS: ${HALLOW_INSTANCE_IDLE_SECS:-120}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/hallow/kinds.toml:/etc/hallow/kinds/kinds.toml:ro
      - ../../servers/test-game/hallow.toml:/etc/hallow/kinds/test-game/hallow.toml:ro

  # Built for the control plane to run, never started by compose.
  game-1:
    scale: 0

  proxy:
    <<: *proxy-deps

  proxy-2:
    <<: *proxy-deps
